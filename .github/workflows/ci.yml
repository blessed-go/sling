name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:


      valkey:
        image: valkey/valkey:9.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Go Vet
        run: go vet ./...

      - name: Run Tests
        env:
          REDIS_TEST_ADDR: localhost:6379
        run: go test -v -race -count=1 ./...

      - name: Run E2E Docker Tests
        run: go test -v -tags e2e -count=1 ./test/e2e/...

      - name: Build Sling CLI
        run: go build -v -o /dev/null ./cmd/sling
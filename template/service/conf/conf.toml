[app]
service_name = "__SERVICE__"
environment = "local"
shutdown_timeout = "10s"

[app.logger]
format = "text"
level = "debug"

[app.telemetry]
otel_endpoint = "jaeger:4317"
otel_insecure = true
prometheus_enabled = true

[app.profiling]
enabled = true

[http]
port = "8080"
read_timeout = "5s"
write_timeout = "10s"

[postgres]
dsn = "postgresql://__SERVICE___user:__SERVICE___pass@postgres:5432/__SERVICE___db?sslmode=disable"
max_open_conns = 25
max_idle_conns = 5

apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: jaeger
          matcherRegex: '(?:"trace_id":\s*"|trace_id=)([a-f0-9]{32})'
          name: TraceID
          url: "$${__value.raw}"